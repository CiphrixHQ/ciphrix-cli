name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - name: Verify the tag is reachable from origin/main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Release tag $GITHUB_REF_NAME does not point to a commit reachable from origin/main" >&2
            exit 1
          fi
      - name: Use npm CLI with trusted publishing support
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check generated command reference
        run: npm run commands:check
      - name: Verify the tag matches the package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - name: Check whether the npm package exists
        id: npm-package
        run: |
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            'https://registry.npmjs.org/%40ciphrix%2Fcli')"
          case "$STATUS" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "npm registry returned unexpected HTTP status $STATUS" >&2
              exit 1
              ;;
          esac
      - name: Bootstrap first npm publication
        if: steps.npm-package.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "The protected npm environment requires NPM_TOKEN for the first publication" >&2
            exit 1
          fi
          npm publish --provenance --access public
      - name: Publish to npm with trusted publishing
        if: steps.npm-package.outputs.exists == 'true'
        run: npm publish --provenance --access public
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
